[project]
name = "pithtrain"
version = "0.1.3"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["deep-ep", "deep-gemm", "flash-attn-4[cu13]>=4.0.0b20", "flash-linear-attention>=0.5.1", "ninja", "pybind11", "torch>=2.12.0", "transformers", "wandb", "zstandard"]

[dependency-groups]
dev = ["pre-commit", "pytest", "ruff"]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61"]

[tool.setuptools.packages.find]
include = ["pithtrain*"]

[tool.uv]
prerelease = "allow"
environments = ["sys_platform == 'linux'"]
# torch >=2.12 cu130 wheels pin nvidia-nccl-cu13==2.29.7; DeepEP needs >=2.30.4
override-dependencies = ["nvidia-nccl-cu13>=2.31.2"]
# deep-ep builds against the project env; isolated builds re-resolve torch's nccl pin
no-build-isolation-package = ["deep-ep"]

[[tool.uv.index]]
name = "torch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
deep-ep = { git = "https://github.com/deepseek-ai/DeepEP", rev = "01dc3aa" }
deep-gemm = { git = "https://github.com/deepseek-ai/DeepGEMM", branch = "main" }
torch = { index = "torch-cu130" }

[tool.uv.extra-build-dependencies]
deep-gemm = ["torch>=2.12.0", "packaging", "setuptools", "wheel"]

[tool.uv.extra-build-variables]
deep-gemm = { DG_FORCE_BUILD = "1", DG_USE_LOCAL_VERSION = "0" }

[tool.mypy]
follow_imports = "skip"
ignore_errors = false
ignore_missing_imports = true
show_column_numbers = true
show_error_context = true

[tool.ruff]
line-length = 100
target-version = "py312"
force-exclude = true

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
ignore = ["E501", "E731"]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["pithtrain"]
